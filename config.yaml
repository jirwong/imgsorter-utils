# Local database name (uses SQLite)
dbName: local.db

# File extensions to index
extensions: jpg,png,gif,jpeg,mp4,cr3,mov,avi,jpeg,mpg,mpeg,iso,pdf,txt,cr2,zip,doc,docx,xls,xlsx,ppt,pptx

# Whether to process directories for indexing
process_directories: true

# Whether to calculate duplicates & update records
update_records: true

# Whether to resync directories even if they have been indexed before (usedful for checking directories that may have changed outside of the application)
resync_directories: false

# Whether to perform an actual file check during resync
resync_check_actual_file: false

